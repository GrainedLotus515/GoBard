services:
  bench-small:
    image: gobard-capacity-bench:local
    environment:
      GOBARD_BENCH_PROFILE: small
      GOBARD_BENCH_DURATION: ${GOBARD_BENCH_DURATION:-15m}
      GOBARD_BENCH_BASELINE_SMALL_MS: ${GOBARD_BENCH_BASELINE_SMALL_MS:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256

  bench-medium:
    image: gobard-capacity-bench:local
    environment:
      GOBARD_BENCH_PROFILE: medium
      GOBARD_BENCH_DURATION: ${GOBARD_BENCH_DURATION:-15m}
      GOBARD_BENCH_BASELINE_MEDIUM_MS: ${GOBARD_BENCH_BASELINE_MEDIUM_MS:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    mem_limit: 2g
    cpus: 4.0
    pids_limit: 256

  bench-large:
    image: gobard-capacity-bench:local
    environment:
      GOBARD_BENCH_PROFILE: large
      GOBARD_BENCH_DURATION: ${GOBARD_BENCH_DURATION:-15m}
      GOBARD_BENCH_BASELINE_LARGE_MS: ${GOBARD_BENCH_BASELINE_LARGE_MS:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    mem_limit: 4g
    cpus: 8.0
    pids_limit: 256
