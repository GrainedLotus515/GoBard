# Large vertical-scaling profile: targets at least 24 simultaneous
# guild playback sessions without changing the application image.
services:
  gobard:
    environment:
      CACHE_LIMIT: ${GOBARD_PROFILE_CACHE_LIMIT:-25GB}
      YTDLP_MAX_CONCURRENCY: ${GOBARD_PROFILE_YTDLP_MAX_CONCURRENCY:-12}
    mem_limit: ${GOBARD_MEMORY_LIMIT:-4g}
    cpus: ${GOBARD_CPUS:-8.0}
    pids_limit: ${GOBARD_PIDS_LIMIT:-256}
