name: Container Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Gitea remains a source and quality-CI host. It never publishes images:
# release images are built, scanned, signed, and published only by GitHub.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Race-enabled tests in the libdave image
        run: docker build --target test --progress=plain .
      - name: Validate rendered deployment profiles
        run: make docker-profile-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read-only formatting, vet, and golangci-lint in Docker
        run: docker build --target lint --progress=plain .
