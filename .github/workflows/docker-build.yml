name: Verify and Publish GHCR Image

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/grainedlotus515/gobard
  LOCAL_IMAGE: gobard:ci

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Race-enabled tests in the libdave build stage
        run: docker build --target test --progress=plain .

      - name: Formatting, vet, and golangci-lint in the build stage
        run: docker build --target lint --progress=plain .

      - name: Reachable vulnerability analysis
        run: docker build --target vulncheck --progress=plain .

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build the runtime image once into the local daemon. All security gates
      # below inspect this exact image before any registry push is permitted.
      - name: Build the linux/amd64 runtime image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag "$LOCAL_IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            .

      - name: Scan the local image for fixed high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate SPDX SBOM for the scanned local image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: gobard-sbom.spdx.json

      - name: Install Cosign
        if: github.event_name == 'push' && github.repository == 'GrainedLotus515/GoBard' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Fail before any push if the repository does not carry the trusted
      # public half of the exact signing key stored in GitHub secrets.
      - name: Verify committed Cosign public key
        if: github.event_name == 'push' && github.repository == 'GrainedLotus515/GoBard' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -s cosign.pub
          cosign public-key --key env://COSIGN_PRIVATE_KEY > /tmp/cosign.pub
          cmp --silent cosign.pub /tmp/cosign.pub

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.repository == 'GrainedLotus515/GoBard' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # A staging tag is required to upload the local image blobs. It is never
      # used as a release tag: public SHA/semver/latest tags are promoted by
      # digest only after the signature and both attestations succeed.
      - name: Push the verified image to an unadvertised staging tag
        id: stage
        if: github.event_name == 'push' && github.repository == 'GrainedLotus515/GoBard' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          staging_tag="$IMAGE_NAME:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "$LOCAL_IMAGE" "$staging_tag"
          docker push "$staging_tag"
          digest="$(docker buildx imagetools inspect "$staging_tag" --format '{{.Manifest.Digest}}')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "staging_tag=$staging_tag" >> "$GITHUB_OUTPUT"

      - name: Create build provenance predicate
        if: steps.stage.outcome == 'success'
        env:
          DIGEST: ${{ steps.stage.outputs.digest }}
        run: |
          cat > provenance.json <<EOF
          {
            "buildDefinition": {
              "buildType": "https://github.com/GrainedLotus515/GoBard/.github/workflows/docker-build.yml",
              "externalParameters": {
                "repository": "$GITHUB_REPOSITORY",
                "ref": "$GITHUB_REF"
              },
              "internalParameters": {},
              "resolvedDependencies": [
                {
                  "uri": "git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@$GITHUB_SHA",
                  "digest": {"gitCommit": "$GITHUB_SHA"}
                }
              ]
            },
            "runDetails": {
              "builder": {"id": "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"},
              "metadata": {"invocationId": "$GITHUB_RUN_ID"}
            }
          }
          EOF
          test -n "$DIGEST"

      - name: Sign and attest the published digest
        id: sign
        if: steps.stage.outcome == 'success'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.stage.outputs.digest }}
        run: |
          image="$IMAGE_NAME@$DIGEST"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$image"
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY --type spdxjson --predicate sbom.spdx.json "$image"
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY --type slsaprovenance --predicate provenance.json "$image"

      - name: Promote the signed digest to release tags
        if: steps.sign.outcome == 'success'
        env:
          DIGEST: ${{ steps.stage.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          printf '%s\n' "$TAGS" | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --prefer-index=false --tag "$tag" "$IMAGE_NAME@$DIGEST"
            resolved="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
            test "$resolved" = "$DIGEST"
          done
