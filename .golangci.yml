version: "2"

run:
  build-tags:
    - integration

linters:
  enable:
    - gocyclo
    - gosec
    - misspell
    - nestif
    - nilerr
    - nilnil
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocyclo:
      # Playback and source-validation state machines are deliberately
      # explicit. Keep a meaningful guardrail without flagging their tested
      # 16-24 branch implementations as a permanent baseline.
      min-complexity: 25
    nestif:
      min-complexity: 8
    gosec:
      severity: medium
      confidence: medium
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          disabled: true
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
          disabled: true
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - unused
        source: func.*\(.*\).*implements
      - linters:
          - revive
        path: _test\.go
      - linters:
          - revive
        text: 'var-naming: func parameter'
        source: defer
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

severity:
  default: error
  rules:
    - linters:
        - revive
      severity: warning

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/GrainedLotus515/gobard)
  exclusions:
    generated: strict
    paths:
      - third_party$
      - builtin$
      - examples$
