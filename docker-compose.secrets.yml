# Optional token-file deployment override. Use this instead of DISCORD_TOKEN:
# docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
# DISCORD_TOKEN_FILE_HOST must be an absolute host path to a regular token file.
# Compose file-source secrets are bind mounts: make the file and its parent
# traversable/readable by container UID 1000 before starting the stack.
services:
  gobard:
    environment:
      DISCORD_TOKEN_FILE: /run/secrets/discord_token
    secrets:
      - source: discord_token
        target: discord_token

secrets:
  discord_token:
    file: ${DISCORD_TOKEN_FILE_HOST:?Set DISCORD_TOKEN_FILE_HOST to the host token-file path}
